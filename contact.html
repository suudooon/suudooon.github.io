<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CONTACT | s-don</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="shared-design.css"><style>main{max-width:960px;margin:auto;padding:56px 28px 110px;color:#252a39}h1{font-size:40px;letter-spacing:-.04em;margin:3px 0 25px}.kicker{color:#1680f8;font-size:12px;font-weight:800;letter-spacing:.13em}.contact-box{border:1px solid #e8eaf0;border-radius:12px;padding:26px;line-height:2;max-width:680px}.contact-link{color:#1680f8;font-weight:700;overflow-wrap:anywhere}p{color:#607085}@media(max-width:700px){main{padding:34px 17px 90px}h1{font-size:31px}.contact-box{padding:18px}}</style></head><body><div id="shared-header"></div><main><div class="kicker">INQUIRIES</div><h1>Contact</h1><div class="contact-box"><p>楽曲制作・リミックス・DJ出演、譜面制作などのお問い合わせはこちらからお願いいたします。</p><p id="contactNote"></p><a class="contact-link" id="contactEmail" hidden></a><p id="contactFallback">連絡先は準備中です。</p></div></main><script src="content.js" defer></script><script src="site-header.js" defer></script><script>window.addEventListener('sdon:content-ready',()=>{const a=window.SDON_CONTENT?.about||{};const n=document.getElementById('contactNote');n.textContent=a.contact_note||'';const e=document.getElementById('contactEmail');if(a.email&&/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(a.email)){e.href='mailto:'+a.email;e.textContent=a.email;e.hidden=false;document.getElementById('contactFallback').hidden=true;}});</script></body></html>
