<script defer>
window.addEventListener('sdon:content-ready',()=>{
 const c=window.SDON_CONTENT;
 const id=s=>document.getElementById(s);
 const esc=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
 id('featuredTitle').textContent=c.featured.title;id('featuredSub').textContent=c.featured.subtitle;id('featuredImage').src=c.featured.image;
 const action=id('featuredAction'), art=id('featuredArtwork');if(c.featured.youtube){for(const a of [action,art]){a.href=c.featured.youtube;a.target='_blank';a.rel='noopener noreferrer';}}else{for(const a of [action,art]){a.removeAttribute('href');a.classList.add('notlinked');}}
 id('news').innerHTML=c.news.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,6).map(n=>`<div class="news-item"><img class="news-thumb" src="${esc(n.image||'assets/release.jpg')}" alt=""><div class="news-body"><div class="news-date">${esc(n.date)}</div><div class="news-title">${n.url?`<a href="${esc(n.url)}" target="_blank" rel="noopener noreferrer">${esc(n.title)}</a>`:esc(n.title)}</div></div></div>`).join('');
 // 既存の自作SVGは廃止し、Web配布のブランド素材を参照する。
 // Simple Icons (community SVG references); BOOTHは公式サイトのfaviconを参照。
 const brandAssets={
  spotify:'https://cdn.simpleicons.org/spotify/1DB954',
  youtube:'https://cdn.simpleicons.org/youtube/FF0033',
  x:'https://cdn.simpleicons.org/x/111111',
  bandcamp:'https://cdn.simpleicons.org/bandcamp/1DA0C3',
  booth:'https://booth.pm/favicon.ico',
  apple:'https://cdn.simpleicons.org/applemusic/FA243C',
  amazon:'https://d5fx445wy2wpk.cloudfront.net/static/logo.svg'
 };
 const icon=(n)=>`<img class="brand-icon-image" src="${brandAssets[n.icon]||''}" alt="" loading="lazy" decoding="async">`;
 const headerIcons=['x','spotify','youtube','bandcamp','booth'];
 
 const links=(items)=>items.map(n=>`<a class="link-item ${n.url?'':'notlinked'}" ${n.url?`href="${esc(n.url)}" target="_blank" rel="noopener noreferrer"`:''}><span class="link-left"><span class="service-icon ${esc(n.icon)}">${icon(n)}</span><span>${esc(n.label)}</span></span></a>`).join('');
 id('listenLinks').innerHTML=links(c.listening);id('buyLinks').innerHTML=links(c.shopping);
 id('social').innerHTML=c.social.map(n=>n.url?`<a href="${esc(n.url)}" target="_blank" rel="noopener noreferrer">${esc(n.label)}</a>`:`<span>${esc(n.label)}</span>`).join('');
});
</script>
