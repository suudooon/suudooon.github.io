<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEWS | s-don</title><style>body{margin:0;background:#fff;color:#252a39;font-family:system-ui,-apple-system,sans-serif}main{max-width:860px;margin:auto;padding:26px 22px}h1{color:#1680f8}a{color:#1680f8;text-decoration:none}.entry{display:flex;gap:20px;align-items:center;border-bottom:1px solid #e8eaf0;padding:18px 0}.entry img{width:120px;height:90px;object-fit:cover;border-radius:10px}.entry time{color:#777f90;font-size:12px}.entry h2{font-size:16px;margin:7px 0}@media(max-width:500px){.entry img{width:95px;height:80px}.entry{gap:12px}}</style><script src="content.js" defer></script><script defer>window.addEventListener('sdon:content-ready',()=>{const box=document.querySelector('#entries');for(const item of window.SDON_CONTENT.news.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)))){const row=document.createElement('article');row.className='entry';const img=document.createElement('img');img.src=item.image||'assets/release.jpg';img.alt='';const content=document.createElement('div');const date=document.createElement('time');date.textContent=item.date;const h=document.createElement('h2');if(item.url){const a=document.createElement('a');a.href=item.url;a.textContent=item.title;h.append(a)}else{h.textContent=item.title}content.append(date,h);row.append(img,content);box.append(row)}});</script></head><body><main><a href="./">← HOME</a><h1>Latest News</h1><div id="entries"></div></main></body></html>
